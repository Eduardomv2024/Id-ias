{% extends "board/base.html" %}
{% block title %}{{ contact|yesno:"Editar,Novo" }} contato · TaskFlow{% endblock %}
{% block header %}{{ contact|yesno:"Editar contato,Novo contato" }}{% endblock %}

{% block content %}
<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-group">
    <label>Nome</label>
    <input name="name" required value="{{ contact.name|default:'' }}">
  </div>
  <div class="form-row cols-2">
    <div class="form-group" style="margin-bottom:0;">
      <label>Empresa</label>
      <input name="company" value="{{ contact.company|default:'' }}">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>E-mail</label>
      <input type="email" name="email" value="{{ contact.email|default:'' }}">
    </div>
  </div>
  <div class="form-group">
    <label>Telefone</label>
    <input name="phone" value="{{ contact.phone|default:'' }}">
  </div>
  <div class="form-actions">
    <button class="btn">Salvar</button>
    <a href="{% url 'contacts' %}" class="btn btn-ghost">Cancelar</a>
  </div>
</form>
{% endblock %}
