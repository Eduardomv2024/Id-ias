{% extends "base.html" %}
{% block title %}{{ 'Editar' if product else 'Novo' }} produto · EstoquePro{% endblock %}
{% block header %}{{ 'Editar produto' if product else 'Novo produto' }}{% endblock %}

{% block content %}
<form method="post" class="form-card">
  <div class="form-group">
    <label>Nome</label>
    <input name="name" required value="{{ product.name if product else '' }}">
  </div>
  <div class="form-row cols-2">
    <div class="form-group" style="margin-bottom:0;">
      <label>SKU</label>
      <input name="sku" required value="{{ product.sku if product else '' }}">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>Categoria</label>
      <input name="category" required value="{{ product.category if product else '' }}">
    </div>
  </div>
  <div class="form-row cols-3">
    <div class="form-group" style="margin-bottom:0;">
      <label>Preço (R$)</label>
      <input type="number" step="0.01" name="price" required value="{{ product.price if product else '' }}">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>Qtd. em estoque</label>
      <input type="number" name="stock_qty" required value="{{ product.stock_qty if product else 0 }}">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>Estoque mínimo</label>
      <input type="number" name="min_stock" value="{{ product.min_stock if product else 5 }}">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn">Salvar</button>
    <a href="{{ url_for('products') }}" class="btn btn-ghost">Cancelar</a>
  </div>
</form>
{% endblock %}
